services:
  - type: web
    name: preload-md
    env: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mdigital-db
          property: externalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://onboarding-mdigital-peach.vercel.app,https://onboarding-mdigital-avatq.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.6

databases:
  - name: mdigital-db
    region: oregon
    plan: free
    ipAllowList: []
