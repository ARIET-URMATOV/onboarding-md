services:
  - type: web
    name: preload-md
    runtime: python
    rootDir: backend
    env: python
    buildCommand: pip install --upgrade pip setuptools && pip install -r requirements.txt
    # entrypoint.sh: alembic upgrade head, затем uvicorn (миграции 004-008 обязательны)
    startCommand: bash entrypoint.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["https://onboarding-mdigital.vercel.app"]'
      - key: FRONTEND_URL
        value: "https://onboarding-mdigital.vercel.app"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # Stage 1 production (заполнить в dashboard; пусто = канал отключён с fallback)
      - key: MPULSE_VERIFICATION_CODE
        sync: false
      - key: WIFI_PASSWORD
        sync: false
      - key: WIFI_ENCRYPTION_KEY
        sync: false
      - key: SHARED_SECRET_KEY
        sync: false
      - key: TELEGRAM_INVITE_LINK
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FIGMA_TEAM_URL
        sync: false
      - key: FIGMA_API_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: HR_NOTIFY_EMAIL
        sync: false
