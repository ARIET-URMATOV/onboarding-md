services:
  db:
    image: postgres:16-alpine
    container_name: mdigital-db
    environment:
      POSTGRES_USER: md
      POSTGRES_PASSWORD: md
      POSTGRES_DB: mdigital
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U md -d mdigital"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
